<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Gramclaw is a local-first Instagram memory workspace for archives, search, saved posts, stories, messages, and relationship history."
    />
    <meta
      http-equiv="refresh"
      content="1;url=https://gramclaw-instagram-memory.jingjing768.chatgpt.site/"
    />
    <link
      rel="canonical"
      href="https://gramclaw-instagram-memory.jingjing768.chatgpt.site/"
    />
    <title>Gramclaw — Local Instagram memory</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0b0c0f;
        color: #f6f2e9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 18% 12%, rgb(238 126 83 / 22%), transparent 35%),
          radial-gradient(circle at 82% 86%, rgb(136 103 255 / 20%), transparent 38%),
          #0b0c0f;
      }

      main {
        width: min(640px, 100%);
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 28px;
        background: rgb(20 21 26 / 82%);
        box-shadow: 0 30px 80px rgb(0 0 0 / 40%);
        text-align: center;
        backdrop-filter: blur(18px);
      }

      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 28px;
        display: grid;
        place-items: center;
        border-radius: 19px;
        background: linear-gradient(145deg, #ff9469, #9f74ff);
        color: #111217;
        font-size: 34px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: clamp(42px, 10vw, 72px);
        line-height: 0.95;
        letter-spacing: -0.065em;
      }

      p {
        max-width: 470px;
        margin: 22px auto 32px;
        color: #bcb8b1;
        font-size: 17px;
        line-height: 1.65;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      a {
        min-height: 48px;
        padding: 13px 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 999px;
        color: #f6f2e9;
        font-weight: 700;
        text-decoration: none;
      }

      a.primary {
        border-color: transparent;
        background: #f6f2e9;
        color: #111217;
      }

      a:focus-visible {
        outline: 3px solid #ff9469;
        outline-offset: 4px;
      }

      small {
        display: block;
        margin-top: 28px;
        color: #858179;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">g</div>
      <h1>Gramclaw</h1>
      <p>
        Your Instagram archive, saved posts, stories, messages, and relationship
        history—searchable in a private, local-first workspace.
      </p>
      <div class="actions">
        <a
          class="primary"
          href="https://gramclaw-instagram-memory.jingjing768.chatgpt.site/"
        >
          Open Gramclaw
        </a>
        <a href="https://github.com/artjing/gramclaw">View source</a>
      </div>
      <small>Redirecting to the live site…</small>
    </main>
  </body>
</html>
